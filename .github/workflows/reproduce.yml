name: Chapter I reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_repository.py
      - run: python scripts/reproduce.py
      - run: python scripts/verify_native.py --output build/native_verification.json --precision 160
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproduction-python-${{ matrix.python }}
          path: |
            build/reproduction.json
            build/rates.csv
            build/native_verification.json

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pdf.lock
      - run: python -m pip install -r requirements-pdf.lock
      - run: python scripts/build_pdf.py --output build/Chapter_I.pdf
      - run: python scripts/verify_pdf.py build/Chapter_I.pdf
      - run: python scripts/build_pdf.py --output build/Chapter_I_repeat.pdf
      - run: cmp build/Chapter_I.pdf build/Chapter_I_repeat.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chapter-I-pdf
          path: build/Chapter_I.pdf
