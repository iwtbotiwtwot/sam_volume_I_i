[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-volume-i-chapter-i"
version = "0.1.0"
description = "Source-bound reproducibility for SAM Volume I, Chapter I"
requires-python = ">=3.11"
dependencies = ["mpmath==1.3.0"]
authors = [{name = "Sean Brady"}, {name = "OpenAI ChatGPT and Codex"}]
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt", "docs/LICENSING.md", "AUTHORS.md"]

[project.optional-dependencies]
pdf = ["reportlab==5.0.1", "matplotlib==3.11.2", "svglib==2.3.0", "pypdf==6.10.0"]

[project.urls]
Repository = "https://github.com/iwtbotiwtwot/sam_volume_I_i"
Licensing = "https://github.com/iwtbotiwtwot/sam_volume_I_i/blob/main/docs/LICENSING.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sam_chapter1 = ["data/*.json"]
